# Kernel modules for the node's virtual gamepads, loaded at boot: uinput for
# the Xbox 360 pad, uhid for the DualSense and Steam Controller, vhci-hcd for
# the opt-in Steam Controller as a USB device (CHA_STEAM_PAD_TRANSPORT=usbip;
# a kernel without it just skips the line).
# Installed by deploy/node/host/install.sh.
uinput
uhid
vhci-hcd
