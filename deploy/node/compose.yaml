# A Cha Node: the agent. It starts each environment's streamer and app
# containers itself, through the Docker engine.
#
# First build the images it runs (once, and after updates):
#   docker build -f deploy/streamer/Dockerfile --target runtime -t cha/streamer:dev .
#   docker compose -f images/compose.yaml build
# First run, either claim the node from the portal: start it, then in the
# portal open Admin → Nodes and enter the pairing code the agent logs
# (`docker compose -f deploy/node/compose.yaml logs agent`; same LAN only):
#   docker compose -f deploy/node/compose.yaml up -d
# or give it a join token from the portal's Nodes page:
#   CHA_PORTAL_URL=https://portal.example CHA_JOIN_TOKEN=chajoin_… \
#     docker compose -f deploy/node/compose.yaml up -d
# The identity lives in the `state` volume, so later runs need nothing.
name: cha-node

services:
  agent:
    build:
      context: ../..
      dockerfile: deploy/node/Dockerfile
    # A published image (ghcr.io/ban-red/cha-node:0.1.0) or, by default, the
    # one `--build` makes here.
    image: ${CHA_NODE_IMAGE:-cha-node:dev}
    restart: unless-stopped
    # Host networking, so the inventory reports the machine's own addresses.
    network_mode: host
    environment:
      # Needed with a join token. When the node is claimed in the portal
      # instead, the node dials the URL its admin used, unless this is set.
      CHA_PORTAL_URL: ${CHA_PORTAL_URL:-}
      CHA_JOIN_TOKEN: ${CHA_JOIN_TOKEN:-}
      # Without a join token, an unclaimed node advertises itself on the LAN
      # and logs a pairing code to claim it with in the portal; false needs a
      # join token instead.
      CHA_DISCOVERY: ${CHA_DISCOVERY:-true}
      # The port an unclaimed node takes a claim on (TCP, until it is claimed).
      CHA_CLAIM_PORT: ${CHA_CLAIM_PORT:-7679}
      # Development only: lets CHA_PORTAL_URL be plain http:// to another
      # machine, e.g. a dev portal on your LAN (`CHA_LISTEN=0.0.0.0:7677 bun run dev`).
      # Otherwise it must be https://, or http:// to this machine (a tunnel).
      CHA_ALLOW_INSECURE_PORTAL: ${CHA_ALLOW_INSECURE_PORTAL:-false}
      CHA_NODE_NAME: ${CHA_NODE_NAME:-}
      CHA_STREAMER_IMAGE: ${CHA_STREAMER_IMAGE:-cha/streamer:dev}
      # Virtual gamepads; set empty on hosts without the uinput module.
      CHA_UINPUT: ${CHA_UINPUT-/dev/uinput}
      # Virtual DualSense and Steam Controller; set empty on hosts without the
      # uhid module (those pads then fall back to an Xbox 360 pad).
      CHA_UHID: ${CHA_UHID-/dev/uhid}
      # WAN by port-forward: the router's public IP (forward UDP 7600-7647).
      CHA_PUBLIC_ADDRESS: ${CHA_PUBLIC_ADDRESS:-}
      # Where app data lives: each user's home for an app they keep data for
      # (users/<user id>/<app>), and what apps share (shared/<app>). A host
      # directory, mounted into the agent at the same path below: Docker is
      # given host paths. Docker makes it, root-owned, if it isn't there.
      CHA_DATA_ROOT: ${CHA_DATA_ROOT:-/srv/cha-portal}
      # Keeps an app's shared directory somewhere else, as app=/path, comma
      # separated: Steam's library on a NAS, say CHA_SHARED_DIRS=steam=/mnt/games/steam.
      # Apps see it at that same path. Bind each one into the agent below,
      # read-only: the agent only checks it is there and makes nothing in it.
      CHA_SHARED_DIRS: ${CHA_SHARED_DIRS:-}
      # NVIDIA's Wine DLLs on the host (nvngx.dll: DLSS under Proton), which the
      # CDI spec leaves out. Bound into apps at this path if the host has it;
      # empty goes without. Needs no mount here: the agent asks the engine.
      CHA_NVIDIA_WINE_DIR: ${CHA_NVIDIA_WINE_DIR-/usr/lib/x86_64-linux-gnu/nvidia/wine}
      # Moonlight hosts on the LAN (Sunshine, Apollo): find them, and the image
      # that streams an adopted one (deploy/README.md, Moonlight hosts).
      CHA_MOONLIGHT: ${CHA_MOONLIGHT:-true}
      CHA_GATEWAY_IMAGE: ${CHA_GATEWAY_IMAGE:-cha/gateway:dev}
      # Moonlight clients: the node hosts GameStream and gives each environment
      # a block of media ports (deploy/README.md, Playing from Moonlight).
      CHA_GAMESTREAM: ${CHA_GAMESTREAM:-false}
      CHA_GAMESTREAM_PORT_BASE: ${CHA_GAMESTREAM_PORT_BASE:-7700}
      CHA_GAMESTREAM_HTTP_PORT: ${CHA_GAMESTREAM_HTTP_PORT:-47989}
      CHA_GAMESTREAM_HTTPS_PORT: ${CHA_GAMESTREAM_HTTPS_PORT:-47984}
      CHA_GAMESTREAM_RTSP_PORT: ${CHA_GAMESTREAM_RTSP_PORT:-48010}
      CHA_GAMESTREAM_QUIT_STOPS: ${CHA_GAMESTREAM_QUIT_STOPS:-false}
      RUST_LOG: ${RUST_LOG:-info}
    # The host's process list, so the agent can match the GPU memory NVML
    # reports (by host pid) to each environment's containers: the per-app VRAM
    # on the Running list. Without it the agent sees no GPU processes and that
    # figure is left out; nothing else changes.
    pid: host
    # NVIDIA through CDI (nvidia-ctk cdi generate), which also brings nvidia-smi
    # and the render node (whose group the apps get).
    # Intel and AMD GPUs need nothing here: the agent reads their names and
    # drivers from /sys/class/drm, which every container sees, and probes each
    # render node in a throwaway container of the streamer image. A node with no
    # NVIDIA GPU can drop this `devices:` section.
    devices:
      - nvidia.com/gpu=all
    volumes:
      - state:/var/lib/cha-node
      # The host's OS name, not the image's.
      - /etc/os-release:/run/host/os-release:ro
      # The host files deploy/node/host/install.sh puts in these directories,
      # so `--doctor` and the agent's start can tell when they are missing or
      # old. Read-only: only the owner, with sudo, changes them. (Docker makes
      # an empty /etc/apparmor.d on a host without AppArmor; that's fine.)
      - /etc/udev/rules.d:/run/host/etc/udev/rules.d:ro
      - /etc/apparmor.d:/run/host/etc/apparmor.d:ro
      - /etc/modules-load.d:/run/host/etc/modules-load.d:ro
      # App data (CHA_DATA_ROOT above): the agent makes users' and shared
      # directories here, owned by the apps' uid (1000), and deletes a user's
      # on a reset. Mounted at the same path as on the host.
      - ${CHA_DATA_ROOT:-/srv/cha-portal}:${CHA_DATA_ROOT:-/srv/cha-portal}
      # A shared directory kept elsewhere (CHA_SHARED_DIRS above), one line each,
      # read-only and at the same path. Mount the share on the host first, and
      # restart the agent if it is mounted again: a bind keeps what was
      # there when it was made. `--doctor` checks it.
      # - /mnt/games/steam:/mnt/games/steam:ro
      # Environments are containers the agent creates. This makes the agent
      # root-equivalent on the node (plan §4.2): keep it small and audited.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  state:
