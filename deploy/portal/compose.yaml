# The portal: cha-control (the API, the SPA and the nodes' WebSocket), with
# its SQLite database in the `data` volume. From the repository root:
#   docker compose -f deploy/portal/compose.yaml up -d --build
# A fresh portal is open to claim: the first visitor to open it creates the
# first admin, so open it right after the first start.
#
# Serve it over HTTPS. Browsers give gamepads, keyboard lock and audio
# worklets only to secure pages, and the session cookie is marked Secure:
# - Tailscale (homelab): keep the portal on localhost and run
#   `tailscale serve --bg 7676` (docs/guides/tailscale.md);
# - Caddy with public DNS: CHA_DOMAIN=portal.example.com and the `tls` profile
#   (ports 80 and 443): `... --profile tls up -d`.
#
# TURN (the `turn` profile: coturn on the host network) is for browsers that
# reach a node neither directly nor through a mesh. Set CHA_TURN_SECRET (long
# and random), CHA_TURN_URLS (how browsers reach coturn, e.g.
# turn:turn.example.com:3478?transport=udp) and CHA_TURN_PEERS (the nodes'
# addresses, e.g. 192.168.1.10-192.168.1.20: the only ones it relays to).
#
# Internet share links (ADR 0022) run a Cloudflare Tunnel from this container,
# only while a link made with "Over the internet" is live. Nothing to set up
# for a quick tunnel (a new *.trycloudflare.com address each time it starts,
# which ends the links made on the old one). For a stable address make a
# named tunnel in Cloudflare, point its public hostname at
# http://localhost:7680, and set CHA_TUNNEL_TOKEN and CHA_TUNNEL_HOSTNAME
# (deploy/README.md, "Sharing a game"). CHA_TUNNEL=off turns the feature off.
name: cha-portal

services:
  portal:
    build:
      context: ../..
      dockerfile: deploy/portal/Dockerfile
    # A published image (ghcr.io/ban-red/cha-portal:0.1.0) or, by default, the
    # one `--build` makes here.
    image: ${CHA_PORTAL_IMAGE:-cha-portal:dev}
    restart: unless-stopped
    # Host networking: the portal finds unclaimed nodes with mDNS, which
    # Docker's bridge network doesn't pass. It listens on CHA_LISTEN.
    network_mode: host
    environment:
      # Localhost by default: for tailscale serve or a proxy on this host.
      CHA_LISTEN: ${CHA_BIND:-127.0.0.1:7676}
      # Looks for unclaimed nodes on the LAN, to claim in Admin → Nodes.
      CHA_DISCOVER_NODES: ${CHA_DISCOVER_NODES:-true}
      # The URL a claimed node is told to reach the portal at (default: the
      # one the claiming admin's browser is using).
      CHA_PUBLIC_URL: ${CHA_PUBLIC_URL:-}
      CHA_SECURE_COOKIES: ${CHA_SECURE_COOKIES:-true}
      CHA_STUN_URLS: ${CHA_STUN_URLS:-}
      CHA_TURN_URLS: ${CHA_TURN_URLS:-}
      CHA_TURN_SECRET: ${CHA_TURN_SECRET:-}
      # Internet share links. on | off.
      CHA_TUNNEL: ${CHA_TUNNEL:-on}
      # A named tunnel: its token (secret) and its public hostname, e.g.
      # play.example.com. Both or neither; without them, quick tunnels.
      CHA_TUNNEL_TOKEN: ${CHA_TUNNEL_TOKEN:-}
      CHA_TUNNEL_HOSTNAME: ${CHA_TUNNEL_HOSTNAME:-}
      # What the tunnel points at: guest routes only, never the portal.
      # Keep it on loopback.
      CHA_GUEST_LISTEN: ${CHA_GUEST_LISTEN:-127.0.0.1:7680}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - data:/var/lib/cha

  caddy:
    profiles: [tls]
    image: caddy:2
    restart: unless-stopped
    # Host networking, to reach the portal on 127.0.0.1:7676 (CHA_BIND must
    # leave it there or on every interface); it serves ports 80 and 443.
    network_mode: host
    environment:
      CHA_DOMAIN: ${CHA_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  coturn:
    profiles: [turn]
    image: coturn/coturn:4.7
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-port=${CHA_TURN_PORT:-3478}
      # Credentials come from the portal, minted per connection with this.
      - --use-auth-secret
      - --static-auth-secret=${CHA_TURN_SECRET:-}
      - --realm=${CHA_DOMAIN:-cha}
      - --fingerprint
      - --no-cli
      # Plain TURN over UDP and TCP; TURN over TLS on 443 is Phase 3's.
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --min-port=${CHA_TURN_MIN_PORT:-49160}
      - --max-port=${CHA_TURN_MAX_PORT:-49200}
      # Relay to the nodes only, never anywhere else on the network.
      - --denied-peer-ip=0.0.0.0-255.255.255.255
      - --denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --allowed-peer-ip=${CHA_TURN_PEERS:-127.0.0.1}
      - --log-file=stdout

volumes:
  data:
  caddy-data:
  caddy-config:
