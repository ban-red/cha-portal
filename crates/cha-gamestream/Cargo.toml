[package]
name = "cha-gamestream"
version.workspace = true
description = "GameStream (Moonlight protocol) host: nvhttp, pairing, RTSP, mDNS and, separately, the control, video and audio streams of one session. Ported from Moonshine."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
aws-lc-rs = "1"
bytes.workspace = true
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
fec-rs = "0.1"          # BSD-2-Clause
form_urlencoded = "1"
futures-util = { workspace = true, features = ["std"] }
hex = "0.4"
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
mdns-sd.workspace = true
quinn-udp.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "sync", "time", "rt", "macros", "io-util"] }
tokio-enet = "0.1"      # BSD-2-Clause
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
tracing.workspace = true
x509-parser = "0.18"
cha-workspace-hack.workspace = true

[dev-dependencies]
# GPL-3.0-or-later, as in cha-gateway and cha-node: a real client for the loopback tests.
moonlight-common = { git = "https://github.com/MrCreativ3001/moonlight-common-rust", rev = "104ddf11f5dabe414c11e87e607fec7976e8bbb1", default-features = false, features = ["tokio-hyper", "rustcrypto"] }
pem = "3"
serde_json.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
