[package]
name = "cha-gamestream"
version = "0.2.1"
description = "GameStream (Moonlight protocol) host: nvhttp, pairing, RTSP, mDNS and, separately, the control, video and audio streams of one session. Ported from Moonshine."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
aws-lc-rs = "1"
bytes = "1"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
fec-rs = "0.1"          # BSD-2-Clause
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mdns-sd = "0.21"
quinn-udp = "0.5"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros", "io-util"] }
tokio-enet = "0.1"      # BSD-2-Clause
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
tracing = "0.1"
x509-parser = "0.18"
cha-workspace-hack = { version = "0.1", path = "../cha-workspace-hack" }

[dev-dependencies]
# GPL-3.0-or-later, as in cha-gateway and cha-node: a real client for the loopback tests.
moonlight-common = { git = "https://github.com/MrCreativ3001/moonlight-common-rust", rev = "104ddf11f5dabe414c11e87e607fec7976e8bbb1", default-features = false, features = ["tokio-hyper", "rustcrypto"] }
pem = "3"
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
