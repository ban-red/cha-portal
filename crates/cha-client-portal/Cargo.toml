[package]
name = "cha-client-portal"
version.workspace = true
description = "The native client's portal transport: signs in to a Cha Portal with a device token and lists its apps (ADR 0013)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
cha-client.workspace = true
cha-client-stream.workspace = true
# TLS is rustls with the ring provider, trusting the system's roots, as in cha-node.
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
cha-workspace-hack.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["default"] }
# The real portal, for the end-to-end sign-in tests.
cha-control.workspace = true
tempfile.workspace = true
sha2.workspace = true
wtransport = { workspace = true, features = ["quinn"] }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
