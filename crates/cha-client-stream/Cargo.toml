[package]
name = "cha-client-stream"
version.workspace = true
description = "The native client's cha-stream/1 receiver: WebTransport to a Cha streamer, as the browser player speaks it (ADR 0013)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
bytes.workspace = true
cha-client.workspace = true
cha-proto.workspace = true
# TLS is rustls with the ring provider, as in wtransport's own default.
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde_json.workspace = true
sha2.workspace = true
socket2 = { workspace = true, features = ["all"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net"] }
tracing.workspace = true
url.workspace = true
wtransport = { workspace = true, features = ["quinn"] }
cha-workspace-hack.workspace = true

# macOS's batched recvmsg_x/sendmsg_x instead of one system call per
# datagram: PyroWave 4:4:4 is ~76,000 datagrams a second, and one call each
# capped the receiver near 300 Mbit/s (Chrome, batching, took 600).
[target.'cfg(target_os = "macos")'.dependencies]
quinn-udp = { workspace = true, features = ["fast-apple-datapath"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
libc.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
