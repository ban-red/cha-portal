[package]
name = "cha-player"
version.workspace = true
description = "The native game-streaming client, macOS first: winit, wgpu on Metal, VideoToolbox, CoreAudio, SDL3 gamepads (ADR 0010)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["gamestream", "portal"]
# The Moonlight transport: Sunshine and Apollo hosts, and Cha nodes.
gamestream = ["dep:cha-client-gamestream"]
# Signing in to a Cha Portal (device tokens, cha:// links).
portal = ["dep:cha-client-portal"]
# A fake host with an in-process VideoToolbox encoder, for trying the player
# without a network. Always built on macOS; the feature only gates the flag.
demo = []

[dependencies]
anyhow.workspace = true
bytes.workspace = true
cha-client.workspace = true
cha-ui-spec.workspace = true
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
cha-workspace-hack.workspace = true

[dev-dependencies]
cha-ui-spec = { workspace = true, features = ["cases"] }

[target.'cfg(target_os = "macos")'.dependencies]
bytemuck = { workspace = true, features = ["derive"] }
cha-client-gamestream = { workspace = true, optional = true }
cha-client-portal = { workspace = true, optional = true }
cha-pyrowave-wgpu.workspace = true
cpal = "0.18"
libc.workspace = true
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = "0.35"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace"] }
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
# objc2-core-services: the Apple Event calls behind the cha:// URL handler.
objc2-foundation = { version = "0.3", features = ["objc2-core-services"] }
objc2-metal = "0.3"
objc2-video-toolbox = "0.3"
opus = "0.4"
pollster.workspace = true
sdl3 = { version = "0.20", features = ["build-from-source-static"] }
wgpu.workspace = true
winit = "0.30"

[lints]
workspace = true
