[package]
name = "cha-control"
version = "0.3.0"
description = "Cha Portal control plane: accounts, nodes, catalog, environments, session brokering"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["cookie"] }
base64 = "0.22"
cha-wire = { path = "../cha-wire" }
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
# TURN credentials (coturn's shared-secret scheme).
hmac = "0.12"
# The claim exchange with a node on the LAN (plain HTTP, one request each).
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# Browses the LAN for unclaimed nodes (ADR 0007).
mdns-sd = "0.21"
# Fetches admin-loaded catalogs and their icons (ADR 0019). TLS is rustls with
# the ring provider, trusting the system's roots, as in cha-node.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
# The session cookie's max-age (the cookie crate's time type).
time = "0.3"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }
cha-workspace-hack = { version = "0.1", path = "../cha-workspace-hack" }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tempfile = "3"
# A hand-driven node connection (tests/gamestream.rs); 0.29 is what axum and cha-node use.
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
