[package]
name = "cha-control"
version.workspace = true
description = "Cha Portal control plane: accounts, nodes, catalog, environments, session brokering"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
argon2 = "0.5"
axum = { workspace = true, features = ["default", "ws"] }
axum-extra = { version = "0.12", features = ["cookie"] }
base64.workspace = true
cha-wire.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
# Splits the WebSocket sockets of a media relay.
futures-util = { workspace = true, features = ["sink", "std"] }
getrandom.workspace = true
# TURN credentials (coturn's shared-secret scheme).
hmac.workspace = true
# The claim exchange with a node on the LAN (plain HTTP, one request each).
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
# Browses the LAN for unclaimed nodes (ADR 0007).
mdns-sd.workspace = true
# Fetches admin-loaded catalogs and their icons (ADR 0019). TLS is rustls with
# the ring provider, trusting the system's roots, as in cha-node.
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha1 = "0.10"
sha2.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror.workspace = true
# The session cookie's max-age (the cookie crate's time type).
time = "0.3"
tokio = { workspace = true, features = ["full"] }
tower-http = { workspace = true, features = ["fs", "set-header", "trace"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v7"] }
cha-workspace-hack.workspace = true

[dev-dependencies]
tempfile.workspace = true
# A hand-driven node connection (tests/gamestream.rs).
tokio-tungstenite.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
