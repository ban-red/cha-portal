[package]
name = "cha-node"
version = "0.3.0"
description = "Cha Node agent: enrolls with the portal, keeps the node channel open, runs environments"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["gamestream"]
# This node's GameStream host for Moonlight clients (ADR 0009, G3): all of it
# is `src/gamestream/` and the few lines that call it. Off, the node doesn't
# serve the host; the environments still get their media ports with
# CHA_GAMESTREAM but nothing serves them. (cha-gamestream stays a dependency
# either way: its client half finds and pairs with Moonlight hosts, ADR 0011.)
gamestream = []

[dependencies]
anyhow = "1"
# The claim port (ADR 0007).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
bytes = "1"
cha-gamestream = { path = "../cha-gamestream" }
cha-sysinfo = { path = "../cha-sysinfo" }
cha-wire = { path = "../cha-wire" }
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
# Our Docker Engine client speaks HTTP/1.1 over the socket with these.
http-body-util = "0.1"
# The portal's Date header, for --doctor's clock check.
httpdate = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
if-addrs = "0.15"
# Advertises an unclaimed node on the LAN (ADR 0007).
mdns-sd = "0.21"
# TLS is rustls with the ring provider throughout, trusting the system's roots
# (add a homelab CA to the system store).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# App data directories are walked with openat and changed through descriptors,
# so a symlink an app plants can't send the agent elsewhere (`src/storage.rs`).
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# 0.29: the version axum uses.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cha-workspace-hack = { version = "0.1", path = "../cha-workspace-hack" }

[dev-dependencies]
axum = "0.8"
cha-control = { path = "../cha-control" }
tempfile = "3"
# Paused time, for the Moonlight refresh timings.
tokio = { version = "1", features = ["test-util"] }
