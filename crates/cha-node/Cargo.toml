[package]
name = "cha-node"
version = "0.1.0"
description = "Cha Node agent: enrolls with the portal and keeps the node channel open"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
cha-wire = { path = "../cha-wire" }
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
if-addrs = "0.15"
# TLS is rustls with the ring provider throughout, trusting the system's roots
# (add a homelab CA to the system store).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# 0.29: the version axum uses.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum = "0.8"
cha-control = { path = "../cha-control" }
tempfile = "3"
