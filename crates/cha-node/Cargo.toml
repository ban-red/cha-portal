[package]
name = "cha-node"
version.workspace = true
description = "Cha Node agent: enrolls with the portal, keeps the node channel open, runs environments"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["gamestream"]
# This node's GameStream host for Moonlight clients (ADR 0009, G3): all of it
# is `src/gamestream/` and the few lines that call it. Off, the node doesn't
# serve the host; the environments still get their media ports with
# CHA_GAMESTREAM but nothing serves them. (cha-gamestream stays a dependency
# either way: its client half finds and pairs with Moonlight hosts, ADR 0011.)
gamestream = []

[dependencies]
anyhow.workspace = true
# The claim port (ADR 0007).
axum = { workspace = true, features = ["http1", "json", "tokio"] }
base64.workspace = true
bytes.workspace = true
cha-gamestream.workspace = true
cha-sysinfo.workspace = true
cha-wire.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
futures-util = { workspace = true, features = ["sink", "std"] }
getrandom.workspace = true
# Our Docker Engine client speaks HTTP/1.1 over the socket with these.
http-body-util.workspace = true
# The portal's Date header, for --doctor's clock check.
httpdate = "1"
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
if-addrs = "0.15"
# Advertises an unclaimed node on the LAN (ADR 0007).
mdns-sd.workspace = true
# TLS is rustls with the ring provider throughout, trusting the system's roots
# (add a homelab CA to the system store).
reqwest = { workspace = true, features = ["json", "rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
# App data directories are walked with openat and changed through descriptors,
# so a symlink an app plants can't send the agent elsewhere (`src/storage.rs`).
rustix = { workspace = true, features = ["fs", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
cha-workspace-hack.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["default"] }
cha-control.workspace = true
tempfile.workspace = true
# Paused time, for the Moonlight refresh timings.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
