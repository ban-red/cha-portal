[package]
name = "cha-wire"
version = "0.5.0"
description = "Cha Portal node <-> portal messages (ADR 0001: JSON over one WebSocket)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.3"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
spake2 = "0.4"
thiserror = "2"
cha-workspace-hack = { version = "0.1", path = "../cha-workspace-hack" }
