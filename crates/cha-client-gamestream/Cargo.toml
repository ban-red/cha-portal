[package]
name = "cha-client-gamestream"
version.workspace = true
description = "The native client's GameStream transport: finds, pairs with and plays Sunshine, Apollo and Cha nodes (ADR 0010)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
cha-client.workspace = true
cha-gamestream.workspace = true
cha-moonlight-input.workspace = true
futures-util = { workspace = true, features = ["std"] }
mdns-sd.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }
tracing.workspace = true
cha-workspace-hack.workspace = true

[dev-dependencies]
# Our own GameStream host and its fakes (its tests' rig is shared by path).
bytes.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
