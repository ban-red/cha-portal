[package]
name = "cha-client-gamestream"
version = "0.5.2"
description = "The native client's GameStream transport: finds, pairs with and plays Sunshine, Apollo and Cha nodes (ADR 0010)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1"
cha-client = { path = "../cha-client" }
cha-gamestream = { path = "../cha-gamestream" }
cha-moonlight-input = { path = "../cha-moonlight-input" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
mdns-sd = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
tracing = "0.1"
cha-workspace-hack = { version = "0.1", path = "../cha-workspace-hack" }

[dev-dependencies]
# Our own GameStream host and its fakes (its tests' rig is shared by path).
bytes = "1"
tokio = { version = "1", features = ["full", "test-util"] }
