[package]
name = "cha-testpattern"
version.workspace = true
description = "The test-pattern environment: a Wayland client drawing a moving bar, a frame counter, a frame-ID strip and an input flash"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
# The PulseAudio wire format, for the tone.
pulseaudio.workspace = true
rustix = { workspace = true, features = ["default", "fs", "mm"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

[lints]
workspace = true
