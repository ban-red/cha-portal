[package]
name = "cha-streamer"
version.workspace = true
description = "One environment's media engine: our headless Wayland compositor, zero-copy NVENC, WebRTC"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# A GameStream (Moonlight) host for the environment's session, ADR 0009: all of
# it in `src/gamestream/`. Linux only like the rest of the engine; the streamer
# image builds with it, a plain `cargo build` does not.
gamestream = ["dep:cha-gamestream"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
cha-workspace-hack.workspace = true

# The engine is Linux-only (Wayland, GBM, EGL, NVENC); elsewhere the binary
# only explains that.
[target.'cfg(target_os = "linux")'.dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["default", "ws"] }
base64.workspace = true
bytes.workspace = true
cha-nvenc.workspace = true
cha-pyrowave.workspace = true
cha-sysinfo.workspace = true
cha-gamestream = { workspace = true, optional = true }
cha-proto.workspace = true
cha-wire.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
futures-util = { workspace = true, features = ["sink", "std"] }
libc.workspace = true
# The PulseAudio wire format (commands, tagstructs); the server is ours.
pulseaudio.workspace = true
serde_json.workspace = true
str0m = { workspace = true, features = ["aws-lc-rs"] }
tokio = { workspace = true, features = ["full"] }
tower-http = { workspace = true, features = ["cors"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
wtransport = { workspace = true, features = ["quinn"] }

# Smithay's master (no release since 0.7.0 in June 2025), pinned.
[target.'cfg(target_os = "linux")'.dependencies.smithay]
git = "https://github.com/Smithay/smithay"
rev = "118e34ffc9b99854a2230c4805e1f37dc9029edb"
default-features = false
features = ["backend_egl", "backend_gbm", "renderer_gl", "desktop", "wayland_frontend"]

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
