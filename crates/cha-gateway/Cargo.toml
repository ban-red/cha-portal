[package]
name = "cha-gateway"
version.workspace = true
description = "Streams a Moonlight host (Sunshine, Apollo) to the browser player, standing in for cha-streamer"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["default"] }
bytes.workspace = true
cha-client.workspace = true
cha-gamestream.workspace = true
cha-moonlight-input.workspace = true
cha-proto.workspace = true
cha-wire.workspace = true
clap = { workspace = true, features = ["derive"] }
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
str0m = { workspace = true, features = ["aws-lc-rs"] }
tokio = { workspace = true, features = ["full"] }
tower-http = { workspace = true, features = ["cors"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
cha-workspace-hack.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
