# Builds Cha Portal's images and publishes them to GitHub's container
# registry, ghcr.io/<owner>/:
# - cha-portal, cha-node and cha-streamer (deploy/);
# - the environments (images/): cha-env-base, then cha-env-test-pattern,
#   -chrome, -firefox, -xfce, -kde and -steam, each built on that exact base.
#   A node runs them with CHA_IMAGE_REGISTRY=ghcr.io/<owner> and
#   CHA_IMAGE_TAG=<version>.
#
# These change rarely, so this runs only when asked: on a release tag
# (v0.1.0 publishes :0.1.0 and :sha-<commit>), or by hand from the Actions
# tab (any branch, :sha-<commit> only). There are no moving tags such as
# :latest: a node pulls an image only when it's missing, so a tag that moved
# would leave nodes on the old image. Pin a version instead.
#
# The Chrome and Steam images contain Google Chrome and Valve's Steam
# bootstrap, which are under their owners' terms, not ours.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # For the signed build provenance.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cha-portal
            file: deploy/portal/Dockerfile
            target: ""
          - name: cha-node
            file: deploy/node/Dockerfile
            target: ""
          - name: cha-streamer
            file: deploy/streamer/Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags, and the OCI labels that tie the image to this repository, its
      # commit and its licence.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The environments' shared base, built first so each environment is built
  # on exactly this one (by digest), not on whatever a tag points at.
  env-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/cha-env-base
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/base/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cha-env-base
          cache-to: type=gha,scope=cha-env-base,mode=max

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cha-env-base
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  env:
    needs: env-base
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        name: [test-pattern, chrome, firefox, xfce, kde, steam]
    steps:
      # Steam and KDE are large; the runner's preinstalled SDKs we don't use
      # take most of its disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/cha-env-${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha
          # Chrome and Steam bundle software under their owners' terms; the
          # label names our licence, for our part of the image.
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/${{ matrix.name }}/Dockerfile
          # `FROM base` in the Dockerfiles: the base this run just pushed.
          build-contexts: |
            base=docker-image://ghcr.io/${{ github.repository_owner }}/cha-env-base@${{ needs.env-base.outputs.digest }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cha-env-${{ matrix.name }}
          cache-to: type=gha,scope=cha-env-${{ matrix.name }},mode=max

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cha-env-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
