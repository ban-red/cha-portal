# Builds Cha Portal's images and publishes them to GitHub's container
# registry, ghcr.io/<owner>/:
# - cha-portal, cha-node and cha-streamer (deploy/);
# - the environments (images/): cha-env-base, then cha-env-test-pattern,
#   -chrome, -firefox, -xfce, -kde and -steam, each built on that exact base.
#   A node runs them with CHA_IMAGE_REGISTRY=ghcr.io/<owner> and
#   CHA_IMAGE_TAG=<version>.
#
# These change rarely, so this runs only when asked: on a release tag
# (v0.1.0 publishes :0.1.0, :latest and :sha-<commit>), or by hand from the
# Actions tab (any branch, :sha-<commit> only). :latest moves to each stable
# release (not to a pre-release such as v0.2.0-rc1) and is for a first pull
# or a look around: a node pulls an image only when it's missing, so one that
# holds an older :latest would never update from it. Pin a version on nodes.
#
# Only images whose inputs changed are rebuilt. scripts/image-inputs.py
# hashes what each image is built from, and every build is also tagged
# :inputs-<hash>. When that tag already exists, the image is not rebuilt: the
# existing image (same digest, same build provenance) gets this run's tags.
# Build caches live in the registry (:buildcache on each image's package, which
# nodes never run), not in GitHub's Actions cache, whose 10 GB repository
# limit these images exceeded: it evicted them and every release rebuilt
# gamescope, mangoapp and Steam's apt layers from scratch. The Actions cache
# is still read, so the first run after the change can use what is left of it.
# Every release still tags every image, so a node runs one version
# throughout. Upstream images and packages aren't in the hash: tick "rebuild"
# when running by hand, or bump REBUILD_EPOCH in the script, to rebuild all.
#
# The environments are pushed with zstd-compressed layers (the base and each
# environment below); cha-portal, cha-node, cha-streamer and cha-gateway stay
# gzip. The environments' layers are large, and zstd is smaller than gzip at
# the same effort and decompresses several times faster on a pull. Docker
# Engine pulls zstd layers from 23.0, and a node needs 26 anyway (SETUP.md).
# The other four are small and the portal may run on older Docker (a NAS).
# Reused images are only re-tagged, so moving to zstd took a REBUILD_EPOCH
# bump to reach images whose inputs hadn't changed; do the same for a similar
# change.
#
# The Chrome and Steam images contain Google Chrome and Valve's Steam
# bootstrap, which are under their owners' terms, not ours.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild every image, even those whose inputs haven't changed (picks up upstream image and package updates)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}

jobs:
  # Each image's inputs hash, as {"cha-node": "<hash>", …}.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      inputs: ${{ steps.hash.outputs.inputs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: hash
        run: |
          inputs=$(python3 scripts/image-inputs.py --json)
          echo "$inputs" | jq .
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"

  image:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # For the signed build provenance.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cha-portal
            file: deploy/portal/Dockerfile
            target: ""
          - name: cha-node
            file: deploy/node/Dockerfile
            target: ""
          - name: cha-streamer
            file: deploy/streamer/Dockerfile
            target: runtime
          - name: cha-gateway
            file: deploy/gateway/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An image built from the same inputs, if the registry has one.
      - id: reuse
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          INPUTS: ${{ fromJSON(needs.plan.outputs.inputs)[matrix.name] }}
          REBUILD: ${{ inputs.rebuild == true }}
        run: |
          if [ "$REBUILD" != true ] &&
            digest=$(docker buildx imagetools inspect "$IMAGE:inputs-$INPUTS" --format '{{json .Manifest}}' 2>/dev/null | jq -er .digest); then
            echo "Inputs unchanged: reusing $IMAGE@$digest"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "Inputs changed (or rebuild asked for): building $IMAGE"
          fi

      # Tags, and the OCI labels that tie the image to this repository, its
      # commit and its licence.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - id: build
        if: steps.reuse.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:inputs-${{ fromJSON(needs.plan.outputs.inputs)[matrix.name] }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:buildcache
            type=gha,scope=${{ matrix.name }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:buildcache,mode=max,oci-mediatypes=true,image-manifest=true,ignore-error=true

      # Unchanged: give the existing image this run's tags. The digest, and so
      # the build provenance attested for it, stay the same.
      - name: Tag the existing image
        if: steps.reuse.outputs.digest != ''
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          DIGEST: ${{ steps.reuse.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker buildx imagetools create --tag "$tag" "$IMAGE@$DIGEST"
            got=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$got" != "$DIGEST" ]; then
              echo "::warning::$tag is $got, not $DIGEST: its build provenance won't match"
            fi
          done

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.build.outputs.digest != ''
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The environments' shared base, built first so each environment is built
  # on exactly this one (by digest), not on whatever a tag points at.
  env-base:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest || steps.reuse.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An image built from the same inputs, if the registry has one.
      - id: reuse
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cha-env-base
          INPUTS: ${{ fromJSON(needs.plan.outputs.inputs)['cha-env-base'] }}
          REBUILD: ${{ inputs.rebuild == true }}
        run: |
          if [ "$REBUILD" != true ] &&
            digest=$(docker buildx imagetools inspect "$IMAGE:inputs-$INPUTS" --format '{{json .Manifest}}' 2>/dev/null | jq -er .digest); then
            echo "Inputs unchanged: reusing $IMAGE@$digest"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "Inputs changed (or rebuild asked for): building $IMAGE"
          fi

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/cha-env-base
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - id: build
        if: steps.reuse.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/base/Dockerfile
          platforms: linux/amd64
          # The tags above are the image exporter's names. zstd layers need
          # OCI media types; force-compression recompresses base layers that
          # came as gzip (Ubuntu's), so the whole image is zstd. On the Steam
          # image's layers, level 12 is 15% smaller than gzip and level 3 is
          # 6% smaller; the encoder has no finer steps above about 10.
          outputs: type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=12,force-compression=true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ghcr.io/${{ github.repository_owner }}/cha-env-base:inputs-${{ fromJSON(needs.plan.outputs.inputs)['cha-env-base'] }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/cha-env-base:buildcache
            type=gha,scope=cha-env-base
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cha-env-base:buildcache,mode=max,oci-mediatypes=true,image-manifest=true,compression=zstd,compression-level=12,force-compression=true,ignore-error=true

      # Unchanged: give the existing image this run's tags. The digest, and so
      # the build provenance attested for it, stay the same.
      - name: Tag the existing image
        if: steps.reuse.outputs.digest != ''
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cha-env-base
          DIGEST: ${{ steps.reuse.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker buildx imagetools create --tag "$tag" "$IMAGE@$DIGEST"
            got=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$got" != "$DIGEST" ]; then
              echo "::warning::$tag is $got, not $DIGEST: its build provenance won't match"
            fi
          done

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.build.outputs.digest != ''
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cha-env-base
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  env:
    needs: [plan, env-base]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        name: [test-pattern, chrome, firefox, xfce, kde, steam]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An image built from the same inputs, if the registry has one.
      - id: reuse
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cha-env-${{ matrix.name }}
          INPUTS: ${{ fromJSON(needs.plan.outputs.inputs)[format('cha-env-{0}', matrix.name)] }}
          REBUILD: ${{ inputs.rebuild == true }}
        run: |
          if [ "$REBUILD" != true ] &&
            digest=$(docker buildx imagetools inspect "$IMAGE:inputs-$INPUTS" --format '{{json .Manifest}}' 2>/dev/null | jq -er .digest); then
            echo "Inputs unchanged: reusing $IMAGE@$digest"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "Inputs changed (or rebuild asked for): building $IMAGE"
          fi

      # Steam and KDE are large; the runner's preinstalled SDKs we don't use
      # take most of its disk. Removed in the background (deleting them takes
      # a minute or more): the build starts at once and doesn't need the room
      # until its layers are big.
      - name: Free disk space
        if: steps.reuse.outputs.digest == ''
        run: |
          df -h /
          nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost >/dev/null 2>&1 &

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/cha-env-${{ matrix.name }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=sha
          # Chrome and Steam bundle software under their owners' terms; the
          # label names our licence, for our part of the image.
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - id: build
        if: steps.reuse.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/${{ matrix.name }}/Dockerfile
          # `FROM base` in the Dockerfiles: the base this run just pushed.
          build-contexts: |
            base=docker-image://ghcr.io/${{ github.repository_owner }}/cha-env-base@${{ needs.env-base.outputs.digest }}
          platforms: linux/amd64
          # The tags above are the image exporter's names. zstd layers need
          # OCI media types; force-compression recompresses base layers that
          # came as gzip (Ubuntu's), so the whole image is zstd. On the Steam
          # image's layers, level 12 is 15% smaller than gzip and level 3 is
          # 6% smaller; the encoder has no finer steps above about 10.
          outputs: type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=12,force-compression=true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ghcr.io/${{ github.repository_owner }}/cha-env-${{ matrix.name }}:inputs-${{ fromJSON(needs.plan.outputs.inputs)[format('cha-env-{0}', matrix.name)] }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/cha-env-${{ matrix.name }}:buildcache
            type=gha,scope=cha-env-${{ matrix.name }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cha-env-${{ matrix.name }}:buildcache,mode=max,oci-mediatypes=true,image-manifest=true,compression=zstd,compression-level=12,force-compression=true,ignore-error=true

      # Unchanged: give the existing image this run's tags. The digest, and so
      # the build provenance attested for it, stay the same.
      - name: Tag the existing image
        if: steps.reuse.outputs.digest != ''
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cha-env-${{ matrix.name }}
          DIGEST: ${{ steps.reuse.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker buildx imagetools create --tag "$tag" "$IMAGE@$DIGEST"
            got=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$got" != "$DIGEST" ]; then
              echo "::warning::$tag is $got, not $DIGEST: its build provenance won't match"
            fi
          done

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.build.outputs.digest != ''
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cha-env-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
