# Builds the portal, node agent and streamer images and publishes them to
# GitHub's container registry, ghcr.io/<owner>/cha-{portal,node,streamer}.
#
# These change rarely, so this runs only when asked: on a release tag
# (v0.1.0 publishes :0.1.0 and :sha-<commit>), or by hand from the Actions
# tab (any branch, :sha-<commit> only). There are no moving tags such as
# :latest: a node pulls the streamer image only when it's missing, so a tag
# that moved would leave nodes on the old image. Pin a version instead.
#
# The environment images (images/) are still built on each node.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # For the signed build provenance.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cha-portal
            file: deploy/portal/Dockerfile
            target: ""
          - name: cha-node
            file: deploy/node/Dockerfile
            target: ""
          - name: cha-streamer
            file: deploy/streamer/Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags, and the OCI labels that tie the image to this repository, its
      # commit and its licence.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
