# Runs scripts/check.sh, the same checks as locally, on Linux. Linux also
# builds and tests the crates the Mac skips (cha-streamer, cha-testpattern);
# their tests that need a GPU, Mesa or the encoders are #[ignore]d.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The streamer's build dependencies, as in deploy/streamer/Dockerfile's
      # dev stage, and GStreamer for the S2 spike's server (a workspace member).
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev cmake \
            libgbm-dev libxkbcommon-dev libegl-dev libdrm-dev libopus-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10
        with:
          toolchain: "1.93"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: ./scripts/check.sh
