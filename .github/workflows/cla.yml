# Asks each new contributor to sign the CLA (CLA.md) on their first pull
# request, and records signatures in signatures/cla.json on the
# cla-signatures branch. It runs on pull_request_target so it can comment on
# pull requests from forks; it never checks out or runs the pull request's
# code.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the Cha Portal CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/ban-red/cha-portal/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # The maintainer holds the copyright in their own work; bots
          # contribute nothing copyrightable.
          allowlist: ban-red,dependabot[bot],renovate[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the Cha Portal CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: >-
            Thanks for your pull request. Before it can be merged, please read
            the [Contributor License Agreement](https://github.com/ban-red/cha-portal/blob/main/CLA.md)
            and, if you agree, sign it by posting the comment below. You keep
            the copyright in your work, and every version that includes it
            stays available under the AGPL. You only sign once.
          custom-allsigned-prcomment: Everyone on this pull request has signed the CLA. Thank you.
          signed-commit-message: "chore(cla): $contributorName signed the CLA in #$pullRequestNo"
          create-file-commit-message: "chore(cla): start the CLA signature list"
