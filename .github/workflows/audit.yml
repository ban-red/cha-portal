# Checks the dependencies against published security advisories: RustSec for
# the Rust workspace (cargo-deny, with deny.toml's ignores and their reasons)
# and GitHub's advisory database for the web workspace (bun audit, from
# bun.lock). Weekly, and on every change to a lockfile or to deny.toml. It is
# apart from the check workflow so that an advisory published today doesn't
# fail an unrelated pull request: a red run here means update the crate or
# package it names (`cargo update -p <crate> --precise <fixed>`,
# `bun audit fix`), or, when nothing we ship is affected, add an ignore with
# its reason to deny.toml.
name: audit

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  push:
    branches: [main]
    paths: [Cargo.lock, bun.lock, deny.toml, .github/workflows/audit.yml]
  pull_request:
    paths: [Cargo.lock, bun.lock, deny.toml, .github/workflows/audit.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, 2026-10
        with:
          toolchain: "1.93"

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Check RustSec advisories
        run: cargo deny --locked check --hide-inclusion-graph advisories

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Check advisories for bun.lock
        run: bun audit
