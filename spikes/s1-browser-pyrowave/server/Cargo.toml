[package]
name = "s1-server"
version = "0.0.0"
description = "Spike S1: synthetic PyroWave-shaped traffic over WebTransport and WebRTC DataChannels"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cha-proto.workspace = true
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
str0m = { version = "0.24", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wtransport = { version = "0.7", features = ["quinn"] }
