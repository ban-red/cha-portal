[package]
name = "s3-gateway"
version = "0.0.0"
description = "Spike S3: a Moonlight (Wolf) to WebRTC passthrough gateway"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
# GPL-3.0-or-later, combinable with our AGPL-3.0-or-later (both licenses' §13).
# Pinned: the crate is young and its API moves.
moonlight-common = { git = "https://github.com/MrCreativ3001/moonlight-common-rust", rev = "104ddf11f5dabe414c11e87e607fec7976e8bbb1", default-features = false, features = ["tokio-hyper", "rustcrypto"] }
pem = "3"
# moonlight-common's HTTPS client builds rustls without a crypto provider; pick one.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
str0m = { version = "0.24", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
