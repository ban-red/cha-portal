# cargo-deny: the dependency rules in CONTRIBUTING.md, checked.
#     cargo deny check licenses bans sources   # scripts/check.sh, offline
#     cargo deny check advisories              # .github/workflows/audit.yml
# Options: https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
# The platforms we build for, as in .config/hakari.toml: the Mac (portal,
# player, client crates) and the node (streamer, images). Windows-, Android-
# and wasm-only crates never reach a build.
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[licenses]
# Compatible with the AGPL-3.0-or-later. A crate offering a choice ("MIT OR
# Apache-2.0", "Apache-2.0 OR GPL-2.0-only") passes when one of its options is
# here. GPL-2.0-only is not: it can't be combined with the AGPL.
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The list is the policy, so a licence no crate uses today stays on it.
unused-allowed-license = "allow"
exceptions = [
    # Data, not code, under its own terms: egui's bundled fonts, in Cha
    # Player's launcher.
    { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

[licenses.private]
# Our own crates (publish = false) are AGPL-3.0-or-later, from the workspace.
ignore = true

[bans]
# Two versions of a crate cost build time, not correctness: report them.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Pulling either back in would undo a decision: OpenSSL (rustls is our TLS,
# with ring or aws-lc-rs) and GStreamer in a product crate (ADR 0004; only
# the S2 spike, kept as the A/B baseline, may use it).
deny = [
    { crate = "openssl", reason = "rustls is our TLS stack" },
    { crate = "openssl-sys", reason = "rustls is our TLS stack" },
    { crate = "gstreamer", wrappers = ["gstreamer-app", "gstreamer-base", "gstreamer-video", "s2-streamer"], reason = "our own media engine, ADR 0004" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Pinned by commit in the manifests that use them.
allow-git = [
    # Smithay's master, for cha-streamer (no release since 0.7.0).
    "https://github.com/Smithay/smithay",
    # A real Moonlight client for cha-gamestream's loopback tests.
    "https://github.com/MrCreativ3001/moonlight-common-rust",
]

[advisories]
# Unmaintained crates are reported for direct dependencies only; a transitive
# one is its parent's to replace.
unmaintained = "workspace"
ignore = [
    # The Marvin attack on `rsa`, which has no fixed release. It reaches only
    # moonlight-common: the S3 spike, and cha-gamestream's tests (a dev-
    # dependency). No shipped binary links it; our own RSA is aws-lc-rs.
    { id = "RUSTSEC-2023-0071", reason = "rsa only in a spike and tests; no fix exists" },
]
